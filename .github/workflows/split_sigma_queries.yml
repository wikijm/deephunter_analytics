name: Split query.json into individual files

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent concurrent pushes to main
concurrency:
  group: split-query-to-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  split-query:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # REQUIRED for rebase to work correctly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run splitter script
        run: |
          python split_query.py

      - name: Commit and push changes
        run: |
          set -e

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add from-sigma-to-dephunter/

          # Commit only if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Automated splitting of query.json"

          # Rebase onto latest main to avoid non-fast-forward errors
          git fetch origin main
          git rebase origin/main || {
            git rebase --abort
            echo "Rebase failed"
            exit 1
          }

          git push origin main
